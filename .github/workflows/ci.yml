name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Echoes workspace
        run: pnpm echoes:validate

      - name: Forge smoke (GDL + auto-play headless)
        run: pnpm forge:smoke

      - name: Forge brain smoke (Jarvis outils, hors-ligne)
        run: pnpm forge:brain-smoke

      - name: Build
        run: pnpm build
