<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forge Ellipse</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; gap: 10px;
      background: radial-gradient(1200px 700px at 50% 20%, #171226, #08060f);
      font-family: system-ui, sans-serif; color: #cfc9e0; padding: 14px;
    }
    header { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
    canvas {
      max-width: min(96vw, 1280px); max-height: 78vh; width: auto; height: auto;
      border-radius: 10px; box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
      background: #0a0814;
    }
    footer { font-size: 13px; opacity: 0.6; display: flex; gap: 14px; align-items: center; }
    kbd { background: #241d3a; border-radius: 4px; padding: 1px 7px; font-family: inherit; }
    #boot-error { color: #ff7a7a; font-size: 14px; }
    #iterate-toggle {
      background: #2b2148; color: #d9d2ee; border: 1px solid #4a3d78; border-radius: 8px;
      padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px;
    }
    #iterate-toggle:hover { background: #372a5c; }
    #iterate-panel {
      width: min(96vw, 720px); background: #141024; border: 1px solid #372a5c; border-radius: 10px;
      padding: 12px; display: grid; gap: 8px;
    }
    #iterate-panel form { display: flex; gap: 8px; }
    #iterate-input {
      flex: 1; background: #0d0a18; color: #e8e2f8; border: 1px solid #2b2148; border-radius: 8px;
      padding: 9px 12px; font: inherit; font-size: 14px;
    }
    #iterate-panel button[type=submit] {
      background: #e8c05a; color: #241a06; border: 0; border-radius: 8px; padding: 9px 16px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    #iterate-status { font-size: 13px; opacity: 0.85; min-height: 1.2em; }
    #iterate-hints { font-size: 12px; opacity: 0.55; }
  </style>
</head>
<body>
  <header id="game-title">Forge Ellipse</header>
  <canvas id="game"></canvas>
  <footer>
    <span><kbd>◀ ▶</kbd> bouger · <kbd>Espace</kbd> saut · <kbd>X</kbd> attaque · <kbd>M</kbd> son</span>
    <button id="iterate-toggle" type="button">💬 Modifier le jeu par prompt</button>
  </footer>
  <div id="iterate-panel" hidden>
    <form id="iterate-form">
      <input id="iterate-input" type="text" placeholder="Ex. : rends le héros plus rapide · plus difficile · ajoute un niveau · renomme le jeu en …" autocomplete="off" />
      <button type="submit">Forger</button>
    </form>
    <p id="iterate-status"></p>
    <p id="iterate-hints">La Forge modifie le GDL, re-valide chaque niveau à l'auto-play, puis recharge. Demandes comprises : vitesse/saut/dégâts/vie du héros, difficulté, ennemis plus/moins rapides, ajouter un niveau, renommer.</p>
  </div>
  <p id="boot-error" hidden></p>
  <script type="module" src="main.js"></script>
</body>
</html>
